[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherbot"
version = "0.1.0"
description = "London (EGLC) daily maximum temperature model for Polymarket weather markets"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
model = ["numpy>=1.26", "pandas>=2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
